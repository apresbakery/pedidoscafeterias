<style id="st">
/* Layout: one phone-width column (max 560px) centred on a soft ground; guided steps home → elige → llena → resumen → datos; sticky action bar at the bottom of each step */
:root{
  --ground:#ECEEF3; --bg:#F7F8FA; --surface:#FFFFFF; --sunk:#EEF0F4; --ink:#1D2433; --muted:#636C7D; --line:#E0E4EB;
  --navy:#2F3E5D; --navy-ink:#FFFFFF; --navy-soft:#E3E8F1; --caramel:#A0642E; --caramel-soft:#F5E9DC;
  --ok:#2E7A4E; --ok-soft:#DDEFE3; --warn:#946016; --warn-soft:#F6EAD5; --bad:#B03E2B; --bad-soft:#F6DFDA;
  --shadow:0 10px 28px rgba(29,36,51,.12);
  --f-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --logo-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1117; --bg:#141821; --surface:#1B202B; --sunk:#171B24; --ink:#E8EBF1; --muted:#9AA3B3; --line:#2A303C;
  --navy:#A9BCE0; --navy-ink:#111520; --navy-soft:#232C3D; --caramel:#E2A873; --caramel-soft:#33261A;
  --ok:#7CCB98; --ok-soft:#1E3326; --warn:#E3B061; --warn-soft:#33281A; --bad:#EE8B78; --bad-soft:#3A221D;
  --shadow:0 10px 28px rgba(0,0,0,.5); --logo-filter:brightness(0) invert(.92); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0E1117; --bg:#141821; --surface:#1B202B; --sunk:#171B24; --ink:#E8EBF1; --muted:#9AA3B3; --line:#2A303C;
  --navy:#A9BCE0; --navy-ink:#111520; --navy-soft:#232C3D; --caramel:#E2A873; --caramel-soft:#33261A;
  --ok:#7CCB98; --ok-soft:#1E3326; --warn:#E3B061; --warn-soft:#33281A; --bad:#EE8B78; --bad-soft:#3A221D;
  --shadow:0 10px 28px rgba(0,0,0,.5); --logo-filter:brightness(0) invert(.92); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* home */
.mast{padding-block:28px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.logo{width:min(230px,62vw);aspect-ratio:437/199;overflow:hidden}
.logo img{display:block;width:137.3%;max-width:none;margin-left:-16.48%;margin-top:-36.61%;filter:var(--logo-filter)}
.tag{font-family:var(--f-display);font-style:italic;font-size:17px;color:var(--muted)}
.modepill{display:inline-flex;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;background:var(--navy-soft);color:var(--navy)}
.hero.photo{background-size:cover;background-position:center;color:#fff;min-height:240px;justify-content:flex-end}
.hero.photo::after{display:none}
.hero{margin-top:18px;border-radius:22px;background:var(--navy);color:var(--navy-ink);padding:24px 22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 40%, color-mix(in srgb,var(--caramel) 70%, #fff 0%), transparent 70%);opacity:.45}
.hero .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.75;font-weight:600}
.hero h1{font-style:italic;font-weight:500;font-size:32px;line-height:1.05;max-width:12ch}
.hero .btn{align-self:flex-start;background:var(--caramel);border-color:var(--caramel);color:var(--on-acc,#fff);margin-top:8px;position:relative;z-index:1}
.aviso{font-size:13px;color:var(--muted);text-align:center;max-width:46ch;margin:14px auto 0}
.sec-t{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:24px;margin:26px 0 12px}
.flavs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.fcard .ph{aspect-ratio:1/1;background:var(--sunk);position:relative;display:grid;place-items:center;max-width:100%}
.fcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.fcard .ph .chip{position:absolute;left:8px;top:8px}
.fcard .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.fcard b{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.2}
.fcard small{color:var(--muted);font-size:13px;line-height:1.35}
.ini{font-family:var(--f-display);font-style:italic;font-size:40px;color:var(--navy);opacity:.4}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;background:var(--caramel-soft);color:var(--caramel)}
.chip.nuevo{background:var(--ok-soft);color:var(--ok)}
.chip.temporada{background:var(--warn-soft);color:var(--warn)}
.chip.limitado{background:var(--bad-soft);color:var(--bad)}
.chip.agotado{background:var(--sunk);color:var(--muted)}
.info{margin:26px 0 30px;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px;font-size:14px}
.info div{display:flex;gap:10px}
.info span:first-child{min-width:92px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:2px}

/* steps */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;display:grid;place-items:center;flex:none;color:var(--ink)}
.top .eb{font-family:var(--f-display);font-style:italic;color:var(--caramel);font-size:14px;line-height:1}
.top h2{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:24px;line-height:1.15}
.body{flex:1;padding-block:14px 20px;display:flex;flex-direction:column;gap:12px}
.cat-h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:8px}
.opt{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px 12px 12px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.opt:hover{border-color:var(--navy)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.opt .sq{width:54px;height:54px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;flex:none;overflow:hidden;font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--navy)}
.opt .sq img{width:100%;height:100%;object-fit:cover}
.opt .nm{flex:1;min-width:0}
.opt .nm b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2}
.opt .nm small{display:block;color:var(--caramel);font-size:13px}
.opt .pr{font-weight:700;font-size:17px;white-space:nowrap;text-align:right}
.opt .pr small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prog .row b{font-family:var(--f-display);font-style:italic;font-size:20px;font-weight:500}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:inherit;transition:width .2s}
.fl{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.fl .av{width:46px;height:46px;border-radius:50%;background:var(--sunk);overflow:hidden;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-style:italic;color:var(--navy);font-size:18px}
.fl .av img{width:100%;height:100%;object-fit:cover}
.fl .nm{flex:1;min-width:0}
.fl .nm b{font-family:var(--f-display);font-weight:600;font-size:16px}
.fl .nm small{display:block;color:var(--caramel);font-size:12px}
.fl .nm .chip{margin-left:6px;vertical-align:2px;font-size:10px;padding:2px 7px}
.step{display:inline-flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:18px;font-weight:700;cursor:pointer;line-height:1;display:grid;place-items:center}
.step button.minus{background:transparent;color:var(--ink);border:1px solid var(--line)}
.step button:disabled{opacity:.25;cursor:default}
.step b{min-width:20px;text-align:center;font-size:16px}
.bottom{position:sticky;bottom:0;z-index:5;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--caramel);border-color:var(--caramel);color:var(--on-acc,#fff)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:999px;box-shadow:0 4px 0 color-mix(in srgb,var(--caramel) 60%,#000 40%)}
.btn.big:disabled{background:var(--sunk);border-color:var(--sunk);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff;box-shadow:0 4px 0 #13502f}
.btn.dash{border-style:dashed;border-color:var(--caramel);color:var(--caramel);background:transparent;width:100%}
.citem{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.citem .hd{display:flex;gap:12px;align-items:center}
.citem .hd .sq{width:42px;height:42px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;color:var(--navy);flex:none}
.citem .hd .nm{flex:1;min-width:0}
.citem .hd .nm b{font-family:var(--f-display);font-weight:600;font-size:16px;display:block}
.citem .hd .nm small{color:var(--ok);font-size:12px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.pills span em{font-style:normal;color:var(--caramel);margin-right:3px}
.totcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.totcard div{display:flex;justify-content:space-between}
.totcard .g{font-family:var(--f-display);font-size:24px;font-weight:700}
.totcard .g span:first-child{font-style:italic;font-weight:500;font-size:20px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--caramel)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:8px}
.ccard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.ccard b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:18px}
.ccard small{font-size:13px;color:var(--muted)}
.ccard[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ccard[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 80%,transparent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.day small{font-weight:500;color:var(--muted);margin-left:4px}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day:disabled{opacity:.45;cursor:not-allowed;text-decoration:none}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:14px}
.kv span{color:var(--muted)}
.kv b{overflow-wrap:anywhere}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.45}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--caramel)}
.check b{font-weight:700}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .2s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>

function toast(m){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = m; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
async function copy(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg || "Copiado"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok = document.execCommand("copy"); }catch(_){} ta.remove(); toast(ok ? (okMsg||"Copiado") : "Selecciona el texto y cópialo"); }
}

/* stock */
const isNull = v => v === null || v === undefined || v === "";
function inCart(pid, sabor, skipKey){ return cart.filter(l => l.pid === pid && l.key !== skipKey).reduce((a,l)=> a + (l.mix ? l.mix.filter(m=>m.n===sabor).reduce((x,m)=>x+m.c,0)*l.cant : (l.sabor===sabor ? l.cant : 0)), 0); }
function leftOf(p, s, skipKey){ return isNull(s.stock) ? Infinity : num(s.stock) - inCart(p.id, s.n, skipKey); }
function soldOut(p){
  const fl = flavors(p);
  if (!fl.length) return !isNull(p.stock) && num(p.stock) - cart.filter(l=>l.pid===p.id).reduce((a,l)=>a+l.cant,0) <= 0;
  return fl.every(s => leftOf(p, s) <= 0);
}
const cartCount = () => cart.reduce((a,l)=>a+l.cant,0);
const subtotal = () => cart.reduce((a,l)=>a+l.cant*l.precio,0);

function render(){
  const v = {home, elige, llena, resumen, datos}[screen]();

  if (screen === "datos") { const sel = $(".day[aria-pressed='true']"); if (sel) { const st = sel.parentElement; st.scrollLeft = sel.offsetLeft - st.offsetLeft - 12; } }

function topBar(eb, title, backTo, extra=""){
  return `<div class="top pad"><button class="back" data-act="go" data-v="${backTo}" aria-label="Regresar">‹</button><div style="flex:1;min-width:0"><div class="eb">${eb}</div><h2>${title}</h2></div>${extra}</div>`;
}
function elige(){
  const groups = {};
  P.forEach(p => (groups[p.cat||"Otros"] = groups[p.cat||"Otros"] || []).push(p));
  const opt = p => { const out = soldOut(p), fl = flavors(p);
    const sub = isBox(p) ? `${num(p.piezas)} a elegir de ${fl.length} sabores` : fl.length > 1 ? `${fl.length} sabores · precio por pieza` : (p.desc || "por pieza");
    const sq = p.foto ? `<img src="${esc(p.foto)}" alt="">` : isBox(p) ? num(p.piezas) : esc((p.nombre||"A")[0]);
    return `<button class="opt" data-act="pick" data-id="${esc(p.id)}" ${out?"disabled":""}><span class="sq">${sq}</span>
      <span class="nm"><b>${esc(p.nombre)}</b><small>${esc(sub)}${tipo==="cafeteria" && num(p.minMay) ? ` · mín. ${num(p.minMay)}` : ""}</small></span>
      <span class="pr">${out ? `<span class="chip agotado">Agotado</span>` : money(price(p))}<small>${isBox(p) ? "la caja" : "c/u"}</small></span></button>`; };
  return `${topBar("paso 1", "Elige qué quieres", cart.length ? "resumen" : "home")}
    <div class="body pad">${Object.entries(groups).map(([c, ps]) => `<div class="cat-h">${esc(c)}</div>${ps.map(opt).join("")}`).join("")}</div>`;
}
function startPick(p, editKey){
  const ex = editKey ? cart.find(l => l.key === editKey) : null;
  PS = {pid:p.id, q:{}, cant:1, editKey: editKey || null};
  flavors(p).forEach(s => PS.q[s.n] = 0);
  if (ex){ if (ex.mix) ex.mix.forEach(m => PS.q[m.n] = m.c); else if (ex.sabor) PS.q[ex.sabor] = ex.cant; else PS.cant = ex.cant; if (ex.mix) PS.cant = ex.cant; }
  go("llena");
}
function llena(){
  const p = prodById(PS.pid), fl = flavors(p), box = isBox(p), n = num(p.piezas), pr = price(p);
  const sum = Object.values(PS.q).reduce((a,b)=>a+b,0);
  const min = tipo === "cafeteria" ? num(p.minMay) : 0;
  const mult = box ? PS.cant : 1;
  const rows = fl.map(s => { const left = leftOf(p, s, PS.editKey); const avail = isNull(s.stock) ? "siempre disponible" : left > 0 ? `disponibles: ${left}` : "agotado";
    const canAdd = (box ? sum < n : true) && (PS.q[s.n] + 1) * mult <= left;
    return `<div class="fl"><span class="av">${flavorImg(s.n)}</span><span class="nm"><b>${esc(s.n)}</b>${tagHtml(s.n)}<small>${avail}</small></span>
      <span class="step"><button class="minus" data-act="q" data-s="${esc(s.n)}" data-d="-1" ${PS.q[s.n]<=0?"disabled":""} aria-label="Quitar ${esc(s.n)}">−</button><b>${PS.q[s.n]}</b>
      <button data-act="q" data-s="${esc(s.n)}" data-d="1" ${canAdd?"":"disabled"} aria-label="Agregar ${esc(s.n)}">+</button></span></div>`; }).join("");
  let ready, label, prog = "";
  if (box){
    ready = sum === n;
    label = ready ? `✓ Listo · ${money(pr*PS.cant)}` : `Faltan ${n-sum} ${n-sum===1?"pieza":"piezas"}`;
    prog = `<div class="prog"><div class="row between"><span class="lbl">En tu caja</span><b>${sum} / ${n}</b></div><div class="bar"><i style="width:${Math.min(100,sum/n*100)}%"></i></div>${ready?`<span class="hint" style="color:var(--ok);font-weight:600">✓ Caja lista</span>`:""}</div>`;
  } else if (fl.length){
    ready = sum > 0 && sum >= min;
    label = !sum ? "Elige al menos una" : sum < min ? `Faltan ${min-sum} para el mínimo` : `✓ Listo · ${sum} pzas · ${money(pr*sum)}`;
    prog = min ? `<div class="prog"><div class="row between"><span class="lbl">Mínimo de mayoreo</span><b>${sum} / ${min}</b></div><div class="bar"><i style="width:${Math.min(100,sum/min*100)}%"></i></div></div>` : "";
  } else { ready = PS.cant > 0; label = `✓ Listo · ${money(pr*PS.cant)}`; }
  const qty = (lbl) => `<div class="fl"><span class="nm"><b>${lbl}</b></span><span class="step"><button class="minus" data-act="cant" data-d="-1" ${PS.cant<=1?"disabled":""} aria-label="Menos">−</button><b>${PS.cant}</b><button data-act="cant" data-d="1" aria-label="Más">+</button></span></div>`;
  return `${topBar("paso 2", box ? `Llena tu caja de ${n}` : fl.length ? "Elige tus sabores" : esc(p.nombre), "elige")}
    <div class="body pad">
      <div class="row between"><b style="font-family:var(--f-display);font-size:18px">${esc(p.nombre)}</b><span style="font-weight:700">${money(pr)} <small class="muted">${box?"la caja":"c/u"}</small></span></div>
      ${p.desc ? `<p class="muted" style="margin:0;font-size:14px">${esc(p.desc)}</p>` : ""}
      ${prog}${rows}
      ${box ? qty("Cajas iguales") : !fl.length ? qty("Piezas") : ""}
    </div>
    <div class="bottom pad"><button class="btn big pri" data-act="add" ${ready?"":"disabled"}>${label}</button></div>`;
}
function addLine(){
  const p = prodById(PS.pid), pr = price(p), fl = flavors(p);
  if (PS.editKey) cart = cart.filter(l => l.key !== PS.editKey);
  if (isBox(p)) cart.push({key:uid(), pid:p.id, nombre:p.nombre, sabor:"", cant:PS.cant, precio:pr, mix:Object.entries(PS.q).filter(([,c])=>c>0).map(([n,c])=>({n,c}))});
  else if (!fl.length) cart.push({key:uid(), pid:p.id, nombre:p.nombre, sabor:"", cant:PS.cant, precio:pr});
  else Object.entries(PS.q).filter(([,c])=>c>0).forEach(([n,c]) => cart.push({key:uid(), pid:p.id, nombre:p.nombre, sabor:n, cant:c, precio:pr, grp:PS.editKey || null}));
  PS = null; save(); go("resumen");
}
function groupedCart(){
  // galletas sueltas del mismo producto se muestran juntas
  const out = [];
  cart.forEach(l => {
    if (!l.mix && l.sabor){ const g = out.find(o => o.loose && o.pid === l.pid); if (g){ g.lines.push(l); return; } out.push({loose:true, pid:l.pid, nombre:l.nombre, lines:[l]}); return; }
    out.push({loose:false, pid:l.pid, nombre:l.nombre, lines:[l]});
  });
  return out;
}
function minIssues(){
  if (tipo !== "cafeteria") return [];
  const out = [];
  [...new Set(cart.map(l => l.pid))].forEach(pid => { const p = prodById(pid); const m = num(p?.minMay); if (!m) return;
    const pz = cart.filter(l=>l.pid===pid).reduce((a,l)=>a+(l.mix? l.mix.reduce((x,y)=>x+y.c,0)*l.cant : l.cant),0);
    if (pz < m) out.push(`${p.nombre}: llevas ${pz}, el mínimo de mayoreo es ${m}.`); });
  return out;
}
function resumen(){
  const g = groupedCart(), issues = minIssues();
  let n = 0;
  const items = g.map(o => {
    const p = prodById(o.pid);
    if (o.loose){ const pz = o.lines.reduce((a,l)=>a+l.cant,0), tot = o.lines.reduce((a,l)=>a+l.cant*l.precio,0);
      return `<div class="citem"><div class="hd"><span class="sq">${pz}</span><span class="nm"><b>${esc(o.nombre)}</b><small>${pz} piezas</small></span><b>${money(tot)}</b></div>
        <div class="pills">${o.lines.map(l=>`<span><em>${l.cant}×</em>${esc(l.sabor)}</span>`).join("")}</div>
        <div class="row"><button class="btn sm dark" data-act="edit-loose" data-id="${esc(o.pid)}" style="flex:1">Editar</button><button class="btn sm" data-act="rm-loose" data-id="${esc(o.pid)}" aria-label="Quitar">🗑</button></div></div>`; }
    const l = o.lines[0]; n++;
    return `<div class="citem"><div class="hd"><span class="sq">${isBox(p) ? num(p.piezas) : l.cant}</span><span class="nm"><b>${isBox(p) ? `Caja ${n} · ${num(p.piezas)} piezas` : esc(l.nombre)}</b>${isBox(p) ? `<small>${esc(l.nombre)}${l.cant>1?` · ${l.cant} cajas`:""} · ✓ completa</small>` : `<small>${l.cant} piezas</small>`}</span><b>${money(l.cant*l.precio)}</b></div>
      ${l.mix ? `<div class="pills">${l.mix.map(m=>`<span><em>${m.c}×</em>${esc(m.n)}</span>`).join("")}</div>` : ""}
      <div class="row"><button class="btn sm dark" data-act="edit" data-k="${l.key}" style="flex:1">Editar</button><button class="btn sm" data-act="rm" data-k="${l.key}" aria-label="Quitar">🗑</button></div></div>`;
  }).join("");
  return `${topBar("tu pedido", cart.length ? `${cartCount()} ${cartCount()===1?"artículo":"artículos"}` : "Vacío", "home")}
    <div class="body pad">${items || `<div class="okbox">Tu pedido está vacío.</div>`}
      <button class="btn dash" data-act="go" data-v="elige">＋ Agregar otro producto</button>
      ${issues.map(i=>`<div class="warnbox">${esc(i)}</div>`).join("")}
      <div class="totcard"><div class="g"><span>Total</span><span>${money(subtotal())}</span></div></div>
    </div>
    <div class="bottom pad"><button class="btn big pri" data-act="go" data-v="datos" ${cart.length && !issues.length ? "" : "disabled"}>Continuar →</button></div>`;
}

/* ---------- datos + envío ---------- */
function minDate(){ const d = new Date(); d.setDate(d.getDate() + num(C.anticipacion||0)); return ymd(d); }
function dayState(s){
  const dw = parseD(s).getDay();
  if (F.modo === "entrega") return (C.diasEntrega||[]).includes(dw) ? "ok" : "sin entrega";
  return (C.diasCerrado||[]).includes(dw) ? "cerrado" : "ok";
}
function dateList(){ const out = []; let d = parseD(minDate()); for (let i=0;i<18;i++){ out.push(ymd(d)); d.setDate(d.getDate()+1); } return out; }
function nextValid(){ return dateList().find(s => dayState(s) === "ok") || ""; }
const comPct = () => F.pago === "tarjeta" ? num(C.comision) : 0;
const comision = () => Math.round(subtotal() * comPct()) / 100;
const REGIMENES = [["601","601 General de Ley Personas Morales"],["603","603 Personas Morales sin Fines Lucrativos"],["605","605 Sueldos y Salarios"],["606","606 Arrendamiento"],["612","612 Personas Físicas con Actividades Empresariales y Profesionales"],["616","616 Sin obligaciones fiscales"],["621","621 Incorporación Fiscal"],["625","625 Plataformas Tecnológicas"],["626","626 Régimen Simplificado de Confianza (RESICO)"]];
const USOS = [["G01","G01 Adquisición de mercancías"],["G03","G03 Gastos en general"],["S01","S01 Sin efectos fiscales"],["CP01","CP01 Pagos"]];
function pagoTexto(){
  if (F.pago === "transferencia") return `Para confirmar tu pedido manda tu comprobante de transferencia por WhatsApp. Banco: ${C.banco||""} · Titular: ${C.titular||""} · CLABE: ${C.clabe||""}${C.cuenta?` · Cuenta: ${C.cuenta}`:""}`;
  if (F.pago === "tarjeta") return `Pago con tarjeta por link de pago${comPct()?`, con una comisión de ${comPct()}% ya incluida en tu total`:""}. ${C.linkPago ? "Manda tu comprobante por WhatsApp." : "Te mandamos el link por WhatsApp al confirmar."}`;
  return `Pagas en efectivo al ${F.modo==="entrega"?"recibir tu pedido":"recoger"}.`;
}
function missing(){
  const m = [];
  if (!cart.length) m.push("agrega productos");
  if (!F.nombre.trim()) m.push("tu nombre");
  if (String(F.tel).replace(/\D/g,"").length < 10) m.push("tu WhatsApp (10 dígitos)");
  if (!F.fecha || dayState(F.fecha) !== "ok" || F.fecha < minDate()) m.push("la fecha");
  if (F.modo === "entrega" && !F.dir.trim()) m.push("la dirección");
  if (F.factura && (!F.rfc.trim() || !F.razon.trim() || !F.cp.trim() || !F.regimen || !F.correo.trim())) m.push("los datos de factura");
  if (!F.okPago) m.push("aceptar las instrucciones de pago");
  if (!F.okPol) m.push("aceptar la política de cancelación");
  if (minIssues().length) m.push("el mínimo de mayoreo");
  return m;
}

      <div class="g"><span>Total</span><span>${money(sub+com)}</span></div></div>
    ${miss.length ? `<button class="btn big pri" disabled>Falta: ${esc(miss.join(", "))}</button>`

           : `<span class="hint" style="text-align:center">Se abre WhatsApp con tu pedido listo para enviar al ${esc(C.waVer)}.</span>`}`}`;

      ${F.pago==="tarjeta" && C.linkPago ? `<a class="btn" href="${esc(C.linkPago)}" target="_blank" rel="noopener">Abrir link de pago</a>` : ""}
      <label class="check"><input type="checkbox" data-f="factura" ${F.factura?"checked":""}> <span><b>Necesito factura</b></span></label>

        <div class="field"><label class="lbl" for="f-rfc">RFC</label><input id="f-rfc" data-f="rfc" value="${esc(F.rfc)}" style="text-transform:uppercase"></div>
        <div class="field"><label class="lbl" for="f-razon">Razón social (como en tu constancia)</label><input id="f-razon" data-f="razon" value="${esc(F.razon)}"></div>
        <div class="field"><label class="lbl" for="f-regimen">Régimen fiscal</label><select id="f-regimen" data-f="regimen"><option value="">Elige…</option>${REGIMENES.map(([k,v])=>`<option value="${k}" ${F.regimen===k?"selected":""}>${v}</option>`).join("")}</select></div>
        <div class="field"><label class="lbl" for="f-cp">Código postal fiscal</label><input id="f-cp" data-f="cp" value="${esc(F.cp)}" inputmode="numeric"></div>
        <div class="field"><label class="lbl" for="f-uso">Uso del CFDI</label><select id="f-uso" data-f="uso">${USOS.map(([k,v])=>`<option value="${k}" ${F.uso===k?"selected":""}>${v}</option>`).join("")}</select></div>
        <div class="field"><label class="lbl" for="f-correo">Correo para la factura</label><input id="f-correo" data-f="correo" value="${esc(F.correo)}" inputmode="email"></div></div>` : ""}
      <div class="field"><label class="lbl" for="f-notas">Comentarios (opcional)</label><textarea id="f-notas" data-f="notas" placeholder="Alergias, dedicatoria, quién recibe…">${esc(F.notas)}</textarea></div>
      <div class="box">
        <label class="check"><input type="checkbox" data-f="okPago" ${F.okPago?"checked":""}> <span><b>Acepto las instrucciones de pago.</b> <span class="muted" id="pagoTxt">${esc(pagoTexto())}</span></span></label>
        <label class="check"><input type="checkbox" data-f="okPol" ${F.okPol?"checked":""}> <span><b>Acepto la política de cancelación.</b> <span class="muted">${esc(C.politica || "Cambios o cancelaciones con mínimo 1 día de anticipación.")}</span></span></label>
      </div>
      <div id="sendArea" style="display:flex;flex-direction:column;gap:10px">${sendArea()}</div>
    </div>`;
}
function b64(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function orderCode(){
  const o = {v:1, n:F.nombre.trim(), b:tipo==="cafeteria"?F.negocio.trim():"", t:F.tel.trim(), k:tipo, m:F.modo, f:F.fecha, h:F.hora.trim(), d:F.modo==="entrega"?F.dir.trim():"",
    p:F.pago, c:comision(), cp:comPct(), no:F.notas.trim(),
    i:cart.map(l => l.mix ? [l.pid, "", l.cant, l.precio, l.mix.map(m=>[m.n,m.c])] : [l.pid, l.sabor, l.cant, l.precio])};
  if (F.factura) o.x = {rfc:F.rfc.trim().toUpperCase(), rs:F.razon.trim(), rg:F.regimen, cp:F.cp.trim(), u:F.uso, e:F.correo.trim()};
  return "APRES1." + b64(JSON.stringify(o));
}
function orderText(){
  const sub = subtotal(), com = comision();
  const quien = tipo === "cafeteria" && F.negocio.trim() ? `${F.negocio.trim()} (${F.nombre.trim()})` : F.nombre.trim();
  let t = `*Nuevo pedido · Après*${tipo==="cafeteria"?" · Cafetería":""}\nCliente: ${quien}\nWhatsApp: ${F.tel.trim()}\n`;
  t += F.modo === "entrega" ? `Entrega: ${fmtDay(F.fecha)}${F.hora?" · "+F.hora:""}\nDirección: ${F.dir.trim()}\n` : `Recoge en Après: ${fmtDay(F.fecha)}${F.hora?" · "+F.hora:""}\n`;
  t += `\n*Pedido*\n`;
  cart.forEach(l => { t += `${l.cant} × ${l.nombre}${l.sabor?" · "+l.sabor:""}${l.mix?" ("+l.mix.map(m=>m.c+" "+m.n).join(", ")+")":""} — ${money(l.cant*l.precio)}\n`; });
  if (com) t += `Comisión tarjeta (${comPct()}%): ${money(com)}\n`;
  t += `*Total: ${money(sub+com)}*\nPago: ${F.pago==="transferencia"?"Transferencia (adjunto comprobante)":F.pago==="tarjeta"?"Tarjeta (link de pago)":"Efectivo"}\n`;
  if (F.factura) t += `\n*Factura*\nRFC: ${F.rfc.trim().toUpperCase()}\nRazón social: ${F.razon.trim()}\nRégimen: ${F.regimen}\nCP: ${F.cp.trim()}\nUso CFDI: ${F.uso}\nCorreo: ${F.correo.trim()}\n`;
  if (F.notas.trim()) t += `\nComentarios: ${F.notas.trim()}\n`;
  t += `\nAcepté las instrucciones de pago y la política de cancelación.\n\nCódigo de pedido:\n${orderCode()}`;
  return t;
}
const waLink = () => `https://wa.me/${C.wa}?text=${encodeURIComponent(orderText())}`;

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  switch (act){
    case "start": go(cart.length ? "resumen" : "elige"); break;
    case "go": go(a.dataset.v); break;
    case "pick": startPick(prodById(a.dataset.id)); break;
    case "q": { const s = a.dataset.s; PS.q[s] = Math.max(0, PS.q[s] + (+a.dataset.d)); render(); break; }
    case "cant": PS.cant = Math.max(1, PS.cant + (+a.dataset.d)); render(); break;
    case "add": addLine(); break;
    case "edit": { const l = cart.find(x => x.key === a.dataset.k); if (l) startPick(prodById(l.pid), l.key); break; }
    case "rm": cart = cart.filter(l => l.key !== a.dataset.k); save(); render(); break;
    case "edit-loose": { const p = prodById(a.dataset.id); const lines = cart.filter(l => l.pid === p.id && !l.mix && l.sabor);
      PS = {pid:p.id, q:{}, cant:1, editKey:"__loose"}; flavors(p).forEach(s => PS.q[s.n] = 0); lines.forEach(l => PS.q[l.sabor] = (PS.q[l.sabor]||0) + l.cant);
      cart = cart.filter(l => !(l.pid === p.id && !l.mix && l.sabor)); PS.editKey = null; go("llena"); break; }
    case "rm-loose": cart = cart.filter(l => !(l.pid === a.dataset.id && !l.mix && l.sabor)); save(); render(); break;
    case "modo": F.modo = a.dataset.v; if (dayState(F.fecha) !== "ok") F.fecha = nextValid(); save(); render(); break;
    case "fecha": F.fecha = a.dataset.v; save(); { const y = window.scrollY; render(); window.scrollTo(0,y); } break;
    case "pago": F.pago = a.dataset.v; save(); { const y = window.scrollY; render(); window.scrollTo(0,y); } break;
    case "copy": copy(a.dataset.v); break;
    case "copy-order": copy(orderText(), "Pedido copiado. Pégalo en WhatsApp."); break;
    case "sent": sent = true; setTimeout(updateSend, 300); break;
  }
});
document.addEventListener("input", e => {
  const f = e.target.dataset?.f; if (!f || e.target.type === "checkbox") return;
  F[f] = e.target.value; save(); updateSend();
});
document.addEventListener("change", e => {
  const f = e.target.dataset?.f; if (!f) return;
  if (e.target.type === "checkbox"){ F[f] = e.target.checked; save(); if (f === "factura"){ const y = window.scrollY; render(); window.scrollTo(0,y); } else updateSend(); return; }
  F[f] = e.target.value; save(); updateSend();
});
load(); render();
})();
</script>

</body></html>
